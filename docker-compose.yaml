services:

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      # - "5672:5672" # needed for code tests # AMQP
      - "15672:15672"  # Management UI
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 5s
      timeout: 5s
      retries: 10


  user_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matteo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matteo -d user_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - user_pgdata:/var/lib/postgresql/data

  user-service:
    build:
      context: .
      dockerfile: internal/user/Dockerfile.user
    image: user-service:latest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: user_postgres
      DB_USER: matteo
      DB_PASSWORD: password
      DB_NAME_USER: user_db
      DB_PORT_USER: 5432
      USER_GRPC_PORT: 8081
      JWT_SECRET: "?&%:(Hzp@g98••••••••E/O.9.cyW#;m"
    depends_on:
      user_postgres:
        condition: service_healthy # necessary to make the container work


  gallery_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matteo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gallery_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U matteo -d gallery_db" ]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - gallery_pgdata:/var/lib/postgresql/data

  gallery-service:
    build:
      context: .
      dockerfile: internal/gallery/Dockerfile.gallery
    image: gallery-service:latest
    environment:
      DB_HOST: gallery_postgres
      DB_USER: matteo
      DB_PASSWORD: password
      DB_NAME_GALLERY: gallery_db
      DB_PORT_GALLERY: 5432
      GALLERY_GRPC_PORT: 8082
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      gallery_postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  upload_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matteo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: upload_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matteo -d upload_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - upload_pgdata:/var/lib/postgresql/data

  upload-service:
    build:
      context: .
      dockerfile: internal/upload/Dockerfile.upload
    image: upload-service:latest
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: upload_postgres
      DB_USER: matteo
      DB_PASSWORD: password
      DB_NAME_UPLOAD: upload_db
      DB_PORT_UPLOAD: 5432
      UPLOAD_GRPC_PORT: 8083
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: gallery.events
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_BUCKET: photos
      MINIO_USE_SSL: false
      GALLERY_SERVICE_ADDRESS: gallery-service:8082
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      upload_postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 10


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped


  notification-service:
    build:
      context: .
      dockerfile: internal/notification/Dockerfile.notification
    image: notification-service:latest
    environment:
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_GRPC_PORT: 8084
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      GALLERY_SERVICE_ADDRESS: gallery-service:8082
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy


  gateway:
    build:
      context: .
      dockerfile: internal/handlers/Dockerfile.gateway
    image: gateway:latest
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: ${HTTP_PORT}
      USER_SERVICE_ADDRESS: user-service:8081
      # Same-origin now that nginx proxies the frontend's /photogallery
      # and /api requests to this service internally (see
      # frontend/nginx.conf), so this is mostly a safety net for direct
      # calls against :8080 during development/testing.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      GALLERY_SERVICE_ADDRESS: gallery-service:8082
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_BUCKET: photos
      UPLOAD_SERVICE_ADDRESS: upload-service:8083
      NOTIFICATION_SERVICE_ADDRESS: notification-service:8084
    depends_on:
      # to fix
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
      args:
        # Left empty: nginx reverse-proxies to the gateway on the same origin.
        # Only override this to call a gateway hosted elsewhere (e.g. a different EC2 instance).
        VITE_API_BASE_URL: ""
    image: frontend:latest
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped


volumes:
  user_pgdata:
  gallery_pgdata:
  upload_pgdata:
  minio-data: