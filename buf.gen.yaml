version: v2

# buf.gen.yaml — code generation config for buf
# Run: buf generate
#
# Prerequisites — install these four binaries once:
#
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
#   go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
#   go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
#
# All four land in $(go env GOPATH)/bin — make sure that directory is on your $PATH.

managed:
  enabled: true

inputs:
  - directory: proto

plugins:
  # Go message structs + JSON marshalling (protoc-gen-go).
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative

  # 2. gRPC service interfaces and client stubs (protoc-gen-go-grpc).
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      # Set to true once you have implementations. Keeps the build clean during scaffolding.
      - require_unimplemented_servers=false

  # 3. grpc-gateway HTTP→gRPC reverse proxy (protoc-gen-grpc-gateway).
  #    Reads google.api.http annotations on UserService and GalleryService.
  - local: protoc-gen-grpc-gateway
    out: gen
    opt:
      - paths=source_relative
      # Only generate handlers for RPCs that have google.api.http annotations.
      - generate_unbound_methods=false

  # 4. OpenAPI v2 spec for the REST surface exposed by the gateway.
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: docs/openapi
    opt:
      - allow_merge=true
      - merge_file_name=api
      - logtostderr=true