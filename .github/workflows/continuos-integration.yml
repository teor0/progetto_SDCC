name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Run unit tests
        run: go test ./... -race -cover -v

  integration:
    name: Integration tests (docker compose)
    runs-on: ubuntu-latest
    needs: [ go ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the gateway to become ready
        run: |
          echo "Waiting for API Gateway on http://localhost:8080 ..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://localhost:8080/photogallery/galleries"; then
              echo "Gateway is up."
              exit 0
            fi
            sleep 5
          done
          echo "Gateway never became ready." >&2
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run integration tests
        env:
          GATEWAY_URL: http://localhost:8080
        run: go test -tags=integration ./test/integration/... -v

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=500

      - name: Tear down the stack
        if: always()
        run: docker compose down -v --remove-orphans
